name: MORPHA quality and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build glyph data
        run: npm run glyphs
      - name: Build
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/data/phonemes.json
          test -f dist/data/processed-glyphs.json
      - name: Browser smoke test
        run: |
          npx --yes vite preview --port 4173 --host 127.0.0.1 --strictPort &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 60000
          node scripts/browser-smoke.js --url http://127.0.0.1:4173
      - name: Upload CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morpha-dist
          path: dist
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - name: Build glyph data
        run: npm run glyphs
      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /morpha-protocol/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
